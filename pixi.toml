[workspace]
name = "netft-cli"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64"]

[dependencies]
cmake = "*"
ninja = "*"
cxx-compiler = "*"
gtest = "*"
libcurl = ">=7.63.0"
python = "*"
pytest = "*"
clang = "*"
clangxx = "*"
clang-tools = "*"
actionlint = "*"
gcovr = "*"

[tasks]
snapshot-check = "python tools/sync_core.py verify"
configure = "cmake -S . -B build -G Ninja -DBUILD_TESTING=ON"
build = { cmd = "cmake --build build", depends-on = ["configure"] }
test = { cmd = "ctest --test-dir build --output-on-failure", depends-on = ["build"] }
format-check = "git ls-files -z '*.cpp' '*.hpp' | xargs -0 clang-format --dry-run --Werror"
tidy = "cmake -S . -B build/tidy -G Ninja -DBUILD_TESTING=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON && clang-tidy -p build/tidy --config-file=.clang-tidy $(git ls-files 'core/netft/src/*.cpp' 'core/netft/src/detail/*.cpp' 'src/*.cpp' ':!core/netft/src/detail/udp_transport_windows.cpp')"
check = { cmd = "true", depends-on = ["snapshot-check", "format-check", "build", "test", "tidy"] }
