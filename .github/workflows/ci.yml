name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: macos-x86_64
            runner: macos-15-intel
          - target: macos-arm64
            runner: macos-15
          - target: windows-x86_64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347
        if: startsWith(matrix.target, 'linux-')
        with:
          cache: true

      - if: startsWith(matrix.target, 'linux-')
        run: pixi run check

      - if: startsWith(matrix.target, 'linux-')
        run: |
          pixi run ctest --test-dir build --output-on-failure
          pixi run ./build/netft --version

      - if: startsWith(matrix.target, 'macos-')
        run: |
          brew install curl googletest ninja nlohmann-json python
          python3 -m venv "${RUNNER_TEMP}/native-tests"
          "${RUNNER_TEMP}/native-tests/bin/python" -m pip install pytest

      - if: startsWith(matrix.target, 'macos-')
        run: |
          cmake -S . -B build/native -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DPython3_EXECUTABLE="${RUNNER_TEMP}/native-tests/bin/python" \
            -DCMAKE_PREFIX_PATH="$(brew --prefix curl);$(brew --prefix googletest);$(brew --prefix nlohmann-json)"
          cmake --build build/native
          ctest --test-dir build/native --output-on-failure
          ./build/native/netft --version

      - if: startsWith(matrix.target, 'macos-')
        run: |
          "${RUNNER_TEMP}/native-tests/bin/python" -m pytest \
            test/artifact/install_sh_test.py -q

      - if: matrix.target == 'windows-x86_64'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          function Assert-NativeSuccess {
            if ($LASTEXITCODE -ne 0) {
              throw "Native command failed with exit code $LASTEXITCODE."
            }
          }
          vcpkg install `
            curl:x64-windows-static `
            gtest:x64-windows-static `
            nlohmann-json:x64-windows-static
          Assert-NativeSuccess

      - if: matrix.target == 'windows-x86_64'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          function Assert-NativeSuccess {
            if ($LASTEXITCODE -ne 0) {
              throw "Native command failed with exit code $LASTEXITCODE."
            }
          }
          python -m pip install pytest
          Assert-NativeSuccess

      - if: matrix.target == 'windows-x86_64'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          function Assert-NativeSuccess {
            if ($LASTEXITCODE -ne 0) {
              throw "Native command failed with exit code $LASTEXITCODE."
            }
          }
          $python = (Get-Command python).Source
          cmake -S . -B build/native `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            "-DPython3_EXECUTABLE=$python" `
            -DBUILD_TESTING=ON
          Assert-NativeSuccess
          cmake --build build/native --config Release
          Assert-NativeSuccess
          ctest --test-dir build/native -C Release --output-on-failure
          Assert-NativeSuccess
          & build/native/Release/netft.exe --version
          Assert-NativeSuccess

      - if: matrix.target == 'windows-x86_64'
        shell: pwsh
        env:
          NETFT_EXECUTABLE: ${{ github.workspace }}\build\native\Release\netft.exe
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          function Assert-NativeSuccess {
            if ($LASTEXITCODE -ne 0) {
              throw "Native command failed with exit code $LASTEXITCODE."
            }
          }
          pwsh -NoProfile -File test/artifact/install_ps1_test.ps1
          Assert-NativeSuccess
